name: ebpfos-repo-control
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Create eBPFOS repository if organization token allows it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/orgs/eunomia-bpf/repos \
            -d '{"name":"ebpfos","description":"Dynamically composable Linux with eBPF components","private":false,"has_issues":true,"has_projects":true,"has_wiki":false}')
          echo "create_repo_http=$code"
          cat "$body"
          if [ "$code" != 201 ] && [ "$code" != 422 ]; then
            echo "EBPFOS_REPO_CREATE_BLOCKED=$code"
          fi
      - name: Fork Linux for eBPFOS if organization token allows it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/gregkh/linux/forks \
            -d '{"organization":"eunomia-bpf","name":"linux-ebpfos","default_branch_only":false}')
          echo "fork_linux_http=$code"
          cat "$body"
          if [ "$code" != 202 ] && [ "$code" != 201 ] && [ "$code" != 422 ]; then
            echo "EBPFOS_LINUX_FORK_BLOCKED=$code"
          fi
